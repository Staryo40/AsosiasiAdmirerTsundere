apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        role: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      containers:
        - name: api
          image: aat/bnpb-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: bnpb-common
            - configMapRef:
                name: api-config
          env:
            - name: BNPB_AGGREGATOR_INTERNAL_KEY
              valueFrom:
                secretKeyRef: {name: bnpb-secrets, key: BNPB_AGGREGATOR_INTERNAL_KEY}
            - name: BNPB_AUTH_INTERNAL_KEY
              valueFrom:
                secretKeyRef: {name: bnpb-secrets, key: BNPB_AUTH_INTERNAL_KEY}
            - name: BNPB_API_RABBITMQ_USER
              valueFrom:
                configMapKeyRef: {name: bnpb-identities, key: BNPB_API_RABBITMQ_USER}
            - name: BNPB_API_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: {name: bnpb-secrets, key: BNPB_API_RABBITMQ_PASSWORD}
          resources:
            # CPU request lets the HPA in k8s/autoscaling measure utilisation; no CPU limit avoids throttling.
            requests: {memory: 128Mi, cpu: 200m}
            limits: {memory: 256Mi}
          # /ready also checks Aggregator and Auth; gating on it would pull every
          # API replica out of service whenever a dependency blips, so the API
          # stays routable and reports degraded data itself.
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep:
                seconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
