# Whole BNPB system: kubectl apply -k k8s (setup steps in KUBERNETES-DEPLOYMENT.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sistem-informasi-kebencanaan-bnpb

labels:
  - pairs:
      app.kubernetes.io/part-of: bnpb
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - mocks.yaml
  - store.yaml
  - broker.yaml
  - aggregator.yaml
  - auth.yaml
  - api.yaml
  - consumers.yaml

configMapGenerator:
  - name: bnpb-common
    envs: [config/bnpb-common.env]
  - name: bnpb-identities
    envs: [config/identities.env]
  - name: bmkg-config
    envs: [config/bmkg.env]
  - name: pvmbg-config
    envs: [config/pvmbg.env]
  - name: aggregator-config
    envs: [config/aggregator.env]
  - name: auth-config
    envs: [config/auth.env]
  - name: api-config
    envs: [config/api.env]
  - name: consumer-config
    envs: [config/consumer.env]

# k8s/secrets.env is git-ignored; generate it from secrets.env.example.
secretGenerator:
  - name: bnpb-secrets
    envs: [secrets.env]

# Built by .github/workflows/images.yml. newTag is the branch name with "/"
# replaced by "-" (e.g. feat-k8s-platform) or "main".
images:
  - name: aat/bmkg
    newName: ghcr.io/staryo40/asosiasiadmirertsundere/bmkg
    newTag: main
  - name: aat/pvmbg
    newName: ghcr.io/staryo40/asosiasiadmirertsundere/pvmbg
    newTag: main
  - name: aat/bnpb-aggregator
    newName: ghcr.io/staryo40/asosiasiadmirertsundere/bnpb-aggregator
    newTag: main
  - name: aat/bnpb-api
    newName: ghcr.io/staryo40/asosiasiadmirertsundere/bnpb-api
    newTag: main
  - name: aat/bnpb-auth
    newName: ghcr.io/staryo40/asosiasiadmirertsundere/bnpb-auth
    newTag: main
  - name: aat/bnpb-consumer-1
    newName: ghcr.io/staryo40/asosiasiadmirertsundere/bnpb-consumer-1
    newTag: main
  - name: aat/bnpb-consumer-2
    newName: ghcr.io/staryo40/asosiasiadmirertsundere/bnpb-consumer-2
    newTag: main
  - name: aat/bnpb-consumer-3
    newName: ghcr.io/staryo40/asosiasiadmirertsundere/bnpb-consumer-3
    newTag: main
  - name: aat/broker-init
    newName: ghcr.io/staryo40/asosiasiadmirertsundere/broker-init
    newTag: main
