# Canonical Store. local-path (k3s default StorageClass) keeps data on the
# disk of the node running the pod, as TA.7 requires for role=store.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        role: store
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          args:
            - postgres
            - -c
            - logging_collector=on
            - -c
            - log_destination=jsonlog
            - -c
            - log_filename=postgresql-%a.log
            - -c
            - log_rotation_age=1d
            - -c
            - log_rotation_size=0
            - -c
            - log_truncate_on_rotation=on
            - -c
            - log_statement=none
            - -c
            - log_min_error_statement=panic
            - -c
            - log_parameter_max_length=0
            - -c
            - log_parameter_max_length_on_error=0
            - -c
            - log_error_verbosity=terse
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: {name: bnpb-identities, key: POSTGRES_DB}
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: {name: bnpb-identities, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: bnpb-secrets, key: POSTGRES_PASSWORD}
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 1Gi}
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
