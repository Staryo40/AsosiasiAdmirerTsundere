# Optional AI provider keys for ai-summarizer; each one that is missing is skipped.
# kubectl -n sistem-informasi-kebencanaan-bnpb create secret generic ai-summarizer-keys \
#   --from-literal=anthropic=<key> --from-literal=openrouter=<key> --from-literal=gemini=<key>
# Kept out of bnpb-secrets because the secrets.env generator fills every key with random values.
apiVersion: v1
kind: Secret
metadata:
  name: ai-summarizer-keys
type: Opaque
stringData:
  anthropic: REPLACE_OR_REMOVE
  openrouter: REPLACE_OR_REMOVE
  gemini: REPLACE_OR_REMOVE
