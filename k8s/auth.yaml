apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  # Tokens live in process memory (internal/auth/tokens.go): a second replica
  # would reject tokens issued by the first, so Auth must stay single-instance.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        role: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: auth
          image: aat/bnpb-auth
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: bnpb-common
            - configMapRef:
                name: auth-config
          env:
            - name: BNPB_AUTH_INTERNAL_KEY
              valueFrom:
                secretKeyRef: {name: bnpb-secrets, key: BNPB_AUTH_INTERNAL_KEY}
            - name: BNPB_MEDIA_CLIENT_ID
              valueFrom:
                configMapKeyRef: {name: bnpb-identities, key: BNPB_MEDIA_CLIENT_ID}
            - name: BNPB_MEDIA_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: bnpb-secrets, key: BNPB_MEDIA_CLIENT_SECRET}
            - name: BNPB_FIELD_CLIENT_ID
              valueFrom:
                configMapKeyRef: {name: bnpb-identities, key: BNPB_FIELD_CLIENT_ID}
            - name: BNPB_FIELD_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: bnpb-secrets, key: BNPB_FIELD_CLIENT_SECRET}
            - name: BNPB_OPS_CLIENT_ID
              valueFrom:
                configMapKeyRef: {name: bnpb-identities, key: BNPB_OPS_CLIENT_ID}
            - name: BNPB_OPS_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: bnpb-secrets, key: BNPB_OPS_CLIENT_SECRET}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep:
                seconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app.kubernetes.io/name: auth
  ports:
    - name: http
      port: 8084
      targetPort: http
