# Observability stack (A2-05). Separate from the app namespace so Lampiran B
# limits and Tester Agent targeting stay on application pods only.
# Deploy: kubectl apply -k k8s/monitoring
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - prometheus-rbac.yaml
  - prometheus.yaml
  - grafana.yaml
