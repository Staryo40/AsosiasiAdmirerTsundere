apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
        editable: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: prometheus
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: bnpb
        orgId: 1
        folder: BNPB
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
  bnpb-http.json: |
    {
      "title": "BNPB HTTP Services",
      "uid": "bnpb-http",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "tags": ["bnpb"],
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": "label_values(http_requests_total, service)",
            "includeAll": true,
            "multi": true,
            "current": {"text": "All", "value": "$__all"}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Request rate (req/s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum by (service) (rate(http_requests_total{service=~\"$service\"}[1m]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error rate (5xx / total)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum by (service) (rate(http_requests_total{service=~\"$service\",code=~\"5..\"}[1m])) / clamp_min(sum by (service) (rate(http_requests_total{service=~\"$service\"}[1m])), 1e-9)",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Latency p50 / p95 / p99",
          "type": "timeseries",
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le, service) (rate(http_request_duration_seconds_bucket{service=~\"$service\"}[1m])))",
              "legendFormat": "{{service}} p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket{service=~\"$service\"}[1m])))",
              "legendFormat": "{{service}} p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le, service) (rate(http_request_duration_seconds_bucket{service=~\"$service\"}[1m])))",
              "legendFormat": "{{service}} p99"
            }
          ]
        },
        {
          "id": 4,
          "title": "Ready replicas (api, aggregator)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 17},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "custom": {"lineInterpolation": "stepAfter"}
            }
          },
          "targets": [
            {
              "expr": "count by (app) (up{job=\"bnpb-pods\",app=~\"api|aggregator\"} == 1)",
              "legendFormat": "{{app}}"
            }
          ]
        }
      ]
    }
  bnpb-streams.json: |
    {
      "title": "BNPB Streams",
      "uid": "bnpb-streams",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "tags": [
        "bnpb"
      ],
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Feed lag (events behind the feed)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "max(bnpb_satellite_feed_lag_events)",
              "legendFormat": "lag"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "description": "latest_offset from GET /v1/session minus the next offset the leading replica reads."
        },
        {
          "id": 2,
          "title": "Feed events per second by kind",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (kind) (rate(bnpb_satellite_feed_events_total[1m]))",
              "legendFormat": "{{kind}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          }
        },
        {
          "id": 3,
          "title": "Arrival to stored latency",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(bnpb_satellite_store_latency_seconds_bucket[1m])))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(bnpb_satellite_store_latency_seconds_bucket[1m])))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(bnpb_satellite_store_latency_seconds_bucket[1m])))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "description": "From a feed event arriving at the satellite service to the Aggregator storing the fire change."
        },
        {
          "id": 4,
          "title": "Outbox backlog (fire changes not yet delivered)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "bnpb_satellite_outbox_backlog",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 5,
          "title": "Late data per second",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(bnpb_satellite_engine_events_total{outcome=\"late\"}[1m]))",
              "legendFormat": "late detections"
            },
            {
              "expr": "sum(rate(bnpb_satellite_engine_events_total{outcome=\"late_update\"}[1m]))",
              "legendFormat": "late updates/retracts"
            },
            {
              "expr": "sum(rate(bnpb_satellite_engine_events_total{outcome=\"duplicate\"}[1m]))",
              "legendFormat": "duplicates"
            },
            {
              "expr": "sum(rate(bnpb_satellite_engine_events_total{outcome=\"orphan\"}[1m]))",
              "legendFormat": "orphans"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "description": "Late detections are counted, not applied silently."
        },
        {
          "id": 6,
          "title": "Fires",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "max(bnpb_satellite_active_fires)",
              "legendFormat": "active"
            },
            {
              "expr": "max(bnpb_satellite_singleton_fires)",
              "legendFormat": "singletons"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 7,
          "title": "Feed lease and connection",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 16
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "bnpb_satellite_leading",
              "legendFormat": "leading {{instance}}"
            },
            {
              "expr": "bnpb_satellite_connected",
              "legendFormat": "connected {{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "description": "Exactly one replica should lead and be connected."
        },
        {
          "id": 8,
          "title": "Failed messages by source and status",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "max by (source, status) (bnpb_failed_messages)",
              "legendFormat": "{{source}} {{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "description": "Parked rows wait for Ops replay; retrying rows are retried by the next poll."
        },
        {
          "id": 9,
          "title": "Field reports per second by outcome",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (outcome) (rate(bnpb_field_reports_total[1m]))",
              "legendFormat": "{{outcome}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          }
        },
        {
          "id": 10,
          "title": "Field Team alert latency (p95, target 5 s)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 32
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, source) (rate(bnpb_notification_latency_seconds_bucket[5m])))",
              "legendFormat": "p95 {{source}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(bnpb_notification_latency_seconds_bucket{source=\"SENSOR_PANTAI\",severity=\"AWAS\"}[5m])))",
              "legendFormat": "p95 critical coastal"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 5}
                ]
              },
              "custom": {
                "thresholdsStyle": {"mode": "line"}
              }
            }
          },
          "description": "From the Aggregator ingesting a hazard to consumer-2 recording its alert. Both clocks are on different nodes, so a clock-skew test distorts this panel."
        },
        {
          "id": 11,
          "title": "Aggregator source poller (lease holder)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 40
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "bnpb_aggregator_poll_leading",
              "legendFormat": "{{instance}}"
            },
            {
              "expr": "sum(bnpb_aggregator_poll_leading)",
              "legendFormat": "replicas polling"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "description": "Exactly one Aggregator replica should poll BMKG, PVMBG and Sensor Pantai. A failover shows as one line dropping and another rising."
        },
        {
          "id": 12,
          "title": "Alert path SLO: alerts within 5 s (target 99%)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 16, "x": 0, "y": 48},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "1 - bnpb:alert_slow_ratio:rate5m", "legendFormat": "last 5 min"},
            {"expr": "1 - bnpb:alert_slow_ratio:rate1h", "legendFormat": "last 1 h"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 0.99}
                ]
              },
              "custom": {"thresholdsStyle": {"mode": "line"}}
            }
          },
          "description": "Share of consumer-2 alerts recorded within 5 s of ingest. Below the line, the alert path is spending its error budget."
        },
        {
          "id": 13,
          "title": "Alert path error budget left (24 h)",
          "type": "stat",
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 48},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "bnpb:alert_error_budget_remaining:1d", "legendFormat": "budget left"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "orange", "value": 0.25},
                  {"color": "green", "value": 0.5}
                ]
              }
            }
          },
          "description": "1 - (share of alerts slower than 5 s over 24 h) / 1%. Negative means the budget is used up."
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        role: other
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: bnpb-observability
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 20
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboards
          configMap:
            name: grafana-dashboards
            items:
              - key: bnpb-http.json
                path: bnpb-http.json
              - key: bnpb-streams.json
                path: bnpb-streams.json
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
