# Apply after replacing TOKEN with the group token from the course assistant:
# kubectl -n sistem-informasi-kebencanaan-bnpb create secret generic satellite-token --from-literal=token=TOKEN
# Kept out of bnpb-secrets because the secrets.env generator fills every key with random values.
apiVersion: v1
kind: Secret
metadata:
  name: satellite-token
type: Opaque
stringData:
  token: REPLACE_WITH_SATELLITE_TOKEN
