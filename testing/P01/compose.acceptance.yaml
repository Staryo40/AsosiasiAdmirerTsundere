services:
  bmkg:
    ports: !override ["127.0.0.1:18081:8081"]
  pvmbg:
    ports: !override ["127.0.0.1:18082:8082"]
  api:
    ports: !override ["127.0.0.1:18080:8080"]

networks:
  bmkg-source:
    ipam:
      config: [{subnet: "10.251.230.0/24"}]
  pvmbg-source:
    ipam:
      config: [{subnet: "10.251.231.0/24"}]
  backend:
    ipam:
      config: [{subnet: "10.251.232.0/24"}]
  canonical-store:
    ipam:
      config: [{subnet: "10.251.233.0/24"}]
  events:
    ipam:
      config: [{subnet: "10.251.234.0/24"}]
  test-store:
    ipam:
      config: [{subnet: "10.251.235.0/24"}]
