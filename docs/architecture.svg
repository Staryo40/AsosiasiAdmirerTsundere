<text x="160" y="464" font-size="10" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Go · :8084 (internal)</text>
<text x="160" y="474" font-size="9" text-anchor="middle" fill="#555" font-family="Arial, Helvetica, sans-serif">token store: in-memory</text>

<rect x="55" y="560" width="210" height="48" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
