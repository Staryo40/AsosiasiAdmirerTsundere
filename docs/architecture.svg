<svg viewBox="0 0 1000 850" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="1000" height="850" fill="#ffffff"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
  </marker>
</defs>

<!-- outer container boundary -->
<rect x="15" y="15" width="970" height="680" rx="10" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="28" y="34" font-size="13" fill="#666" font-family="Arial, Helvetica, sans-serif">Container boundary — one Docker Compose project</text>

<!-- bmkg-source zone -->
<rect x="35" y="45" width="230" height="80" rx="8" fill="#eef6ff" stroke="#8fb8e0" stroke-dasharray="4,3"/>
<text x="45" y="60" font-size="11" fill="#3b689e" font-family="Arial, Helvetica, sans-serif">network: bmkg-source</text>
<rect x="55" y="70" width="190" height="45" rx="6" fill="#fff" stroke="#333"/>
<text x="150" y="88" font-size="12" text-anchor="middle" font-weight="bold" font-family="Arial, Helvetica, sans-serif">BMKG (Mock)</text>
<text x="150" y="103" font-size="10.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Rust / Axum · :8081</text>

<!-- pvmbg-source zone -->
<rect x="735" y="45" width="230" height="80" rx="8" fill="#eef6ff" stroke="#8fb8e0" stroke-dasharray="4,3"/>
<text x="745" y="60" font-size="11" fill="#3b689e" font-family="Arial, Helvetica, sans-serif">network: pvmbg-source</text>
