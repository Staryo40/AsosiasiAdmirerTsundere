<text x="500" y="216" font-size="10.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Go · :8083 (internal)</text>
<text x="500" y="229" font-size="9.5" text-anchor="middle" fill="#555" font-family="Arial, Helvetica, sans-serif">sole owner of the Canonical Store</text>

