<text x="645" y="594" font-size="10" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Notifier · :8086</text>
<text x="645" y="607" font-size="9.5" text-anchor="middle" fill="#555" font-family="Arial, Helvetica, sans-serif">own SQLite</text>

<rect x="770" y="560" width="180" height="62" rx="6" fill="#fff" stroke="#333"/>
