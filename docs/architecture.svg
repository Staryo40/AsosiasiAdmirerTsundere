<text x="430" y="594" font-size="10" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Dashboard · :8085</text>
<text x="430" y="607" font-size="9.5" text-anchor="middle" fill="#555" font-family="Arial, Helvetica, sans-serif">own SQLite</text>

<rect x="555" y="560" width="180" height="62" rx="6" fill="#fff" stroke="#333"/>
