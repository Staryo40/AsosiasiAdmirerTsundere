<line x1="170" y1="725" x2="155" y2="608" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="500" y1="725" x2="190" y2="608" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="830" y1="725" x2="225" y2="608" stroke="#333" stroke-width="1" marker-end="url(#arrow)"/>
<text x="500" y="690" font-size="9.5" text-anchor="middle" fill="#555" font-family="Arial, Helvetica, sans-serif">HTTPS + Bearer access token; Summary/Full fields per role</text>

