<text x="860" y="594" font-size="10" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Portal Feed · :8087 (profile demo)</text>
<text x="860" y="607" font-size="9.5" text-anchor="middle" fill="#555" font-family="Arial, Helvetica, sans-serif">own SQLite</text>

<line x1="610" y1="475" x2="450" y2="560" stroke="#333" stroke-width="1.1" marker-end="url(#arrow)"/>
<line x1="645" y1="475" x2="645" y2="560" stroke="#333" stroke-width="1.1" marker-end="url(#arrow)"/>
<line x1="690" y1="475" x2="840" y2="560" stroke="#333" stroke-width="1.1" marker-end="url(#arrow)"/>
<rect x="595" y="505" width="220" height="16" fill="#eefbf0"/>
<text x="705" y="517" font-size="9.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">bind: each consumer's own durable quorum queue</text>

<!-- backend zone -->
<rect x="35" y="400" width="250" height="230" rx="8" fill="#f5eefc" stroke="#b79bdc" stroke-dasharray="4,3"/>
