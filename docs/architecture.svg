<text x="500" y="337" font-size="10" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Canonical Store</text>

<line x1="470" y1="235" x2="470" y2="305" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
