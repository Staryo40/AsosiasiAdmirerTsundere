<text x="850" y="88" font-size="12" text-anchor="middle" font-weight="bold" font-family="Arial, Helvetica, sans-serif">PVMBG (Mock)</text>
<text x="850" y="103" font-size="10.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Kotlin / Ktor · :8082</text>

<!-- aggregator -->
<rect x="400" y="175" width="200" height="60" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
