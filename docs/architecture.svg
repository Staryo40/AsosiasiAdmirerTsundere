<text x="645" y="462" font-size="10" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">fanout exchange: hazard.events</text>

<line x1="560" y1="235" x2="630" y2="430" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
