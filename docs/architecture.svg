<text x="245" y="158" font-size="9.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">/tsunami-warnings (X-BMKG-Key)</text>

<line x1="800" y1="115" x2="580" y2="180" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
