name: Images

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - bmkg/**
      - pvmbg/**
      - bnpb/**
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: bmkg, context: bmkg, file: bmkg/Dockerfile }
          - { name: pvmbg, context: pvmbg, file: pvmbg/Dockerfile }
          - { name: bnpb-aggregator, context: bnpb, file: bnpb/cmd/aggregator/Dockerfile }
          - { name: bnpb-api, context: bnpb, file: bnpb/cmd/api/Dockerfile }
          - { name: bnpb-auth, context: bnpb, file: bnpb/cmd/auth/Dockerfile }
          - { name: bnpb-consumer-1, context: bnpb, file: bnpb/cmd/consumer-1/Dockerfile }
          - { name: bnpb-consumer-2, context: bnpb, file: bnpb/cmd/consumer-2/Dockerfile }
          - { name: bnpb-consumer-3, context: bnpb, file: bnpb/cmd/consumer-3/Dockerfile }
          - { name: broker-init, context: bnpb, file: bnpb/broker/init.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
