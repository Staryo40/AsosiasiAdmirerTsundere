name: bnpb

x-bnpb-environment: &bnpb-environment
  BNPB_LOG_LEVEL: ${BNPB_LOG_LEVEL:-INFO}
  BNPB_MAX_IN_FLIGHT: ${BNPB_MAX_IN_FLIGHT:-64}
  BNPB_OUTBOUND_HTTP_TIMEOUT: ${BNPB_OUTBOUND_HTTP_TIMEOUT:-5s}
  BNPB_READ_HEADER_TIMEOUT: ${BNPB_READ_HEADER_TIMEOUT:-5s}
  BNPB_READ_TIMEOUT: ${BNPB_READ_TIMEOUT:-10s}
  BNPB_WRITE_TIMEOUT: ${BNPB_WRITE_TIMEOUT:-10s}
  BNPB_IDLE_TIMEOUT: ${BNPB_IDLE_TIMEOUT:-60s}
  BNPB_SHUTDOWN_TIMEOUT: ${BNPB_SHUTDOWN_TIMEOUT:-5s}

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bnpb}
      POSTGRES_USER: ${POSTGRES_USER:-bnpb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - canonical-store
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.5-alpine
    hostname: bnpb-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-bnpb}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - events
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    environment:
      <<: *bnpb-environment
      BNPB_API_HTTP_ADDR: ${BNPB_API_HTTP_ADDR:-:8080}
    ports:
      - "8080:8080"
    networks:
      - backend
    healthcheck:
      test: [CMD, /bnpb-api, -healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5

  aggregator:
    build:
      context: .
      dockerfile: cmd/aggregator/Dockerfile
    environment:
      <<: *bnpb-environment
      BNPB_AGGREGATOR_HTTP_ADDR: ${BNPB_AGGREGATOR_HTTP_ADDR:-:8083}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
      - canonical-store
      - events
    healthcheck:
      test: [CMD, /bnpb-aggregator, -healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: cmd/auth/Dockerfile
    environment:
      <<: *bnpb-environment
      BNPB_AUTH_HTTP_ADDR: ${BNPB_AUTH_HTTP_ADDR:-:8084}
    networks:
      - backend
    healthcheck:
      test: [CMD, /bnpb-auth, -healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5

  consumer-1:
    build:
      context: .
      dockerfile: cmd/consumer-1/Dockerfile
    environment:
      <<: *bnpb-environment
      BNPB_CONSUMER_1_HTTP_ADDR: ${BNPB_CONSUMER_1_HTTP_ADDR:-:8085}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - events
    healthcheck:
      test: [CMD, /bnpb-consumer-1, -healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5

  consumer-2:
    build:
      context: .
      dockerfile: cmd/consumer-2/Dockerfile
    environment:
      <<: *bnpb-environment
      BNPB_CONSUMER_2_HTTP_ADDR: ${BNPB_CONSUMER_2_HTTP_ADDR:-:8086}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - events
    healthcheck:
      test: [CMD, /bnpb-consumer-2, -healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5

  consumer-3:
    profiles: [demo]
    build:
      context: .
      dockerfile: cmd/consumer-3/Dockerfile
    environment:
      <<: *bnpb-environment
      BNPB_CONSUMER_3_HTTP_ADDR: ${BNPB_CONSUMER_3_HTTP_ADDR:-:8087}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - events
    healthcheck:
      test: [CMD, /bnpb-consumer-3, -healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  backend:
  canonical-store:
    internal: true
  events:

volumes:
  postgres-data:
  rabbitmq-data:
