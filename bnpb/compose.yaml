name: bnpb

x-bnpb-environment: &bnpb-environment
  BNPB_LOG_LEVEL: ${BNPB_LOG_LEVEL:-INFO}
  BNPB_MAX_IN_FLIGHT: ${BNPB_MAX_IN_FLIGHT:-64}
  BNPB_OUTBOUND_HTTP_TIMEOUT: ${BNPB_OUTBOUND_HTTP_TIMEOUT:-5s}
  BNPB_READ_HEADER_TIMEOUT: ${BNPB_READ_HEADER_TIMEOUT:-5s}
  BNPB_READ_TIMEOUT: ${BNPB_READ_TIMEOUT:-10s}
  BNPB_WRITE_TIMEOUT: ${BNPB_WRITE_TIMEOUT:-10s}
  BNPB_IDLE_TIMEOUT: ${BNPB_IDLE_TIMEOUT:-60s}
  BNPB_SHUTDOWN_TIMEOUT: ${BNPB_SHUTDOWN_TIMEOUT:-5s}

services:
  postgres:
    image: postgres:18.6-alpine
    # jsonlog lives in PGDATA/log, not `compose logs`; rotate through seven daily files.
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_destination=jsonlog
      - -c
      - log_filename=postgresql-%a.log
      - -c
      - log_rotation_age=1d
      - -c
      - log_rotation_size=0
      - -c
      - log_truncate_on_rotation=on
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_error_verbosity=terse
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bnpb}
      POSTGRES_USER: ${POSTGRES_USER:-bnpb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - canonical-store
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    hostname: bnpb-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-bnpb}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./broker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - events
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:15672/api/health/checks/ready-to-serve-clients]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: declares queue bound policies and per-identity RabbitMQ users
  # over the management HTTP API (see broker/provision.sh). Every PUT it
  # makes is idempotent, so re-running on every `compose up` is safe.
  broker-init:
    build:
      context: .
      dockerfile: broker/init.Dockerfile
    restart: "no"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-bnpb}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
      BNPB_RABBITMQ_PUBLISHER_USER: ${BNPB_RABBITMQ_PUBLISHER_USER:-publisher}
      BNPB_RABBITMQ_PUBLISHER_PASSWORD: ${BNPB_RABBITMQ_PUBLISHER_PASSWORD:?Set BNPB_RABBITMQ_PUBLISHER_PASSWORD in .env}
      BNPB_CONSUMER_1_RABBITMQ_USER: ${BNPB_CONSUMER_1_RABBITMQ_USER:-dashboard}
      BNPB_CONSUMER_1_RABBITMQ_PASSWORD: ${BNPB_CONSUMER_1_RABBITMQ_PASSWORD:?Set BNPB_CONSUMER_1_RABBITMQ_PASSWORD in .env}
      BNPB_CONSUMER_2_RABBITMQ_USER: ${BNPB_CONSUMER_2_RABBITMQ_USER:-notifications}
      BNPB_CONSUMER_2_RABBITMQ_PASSWORD: ${BNPB_CONSUMER_2_RABBITMQ_PASSWORD:?Set BNPB_CONSUMER_2_RABBITMQ_PASSWORD in .env}
      BNPB_CONSUMER_3_RABBITMQ_USER: ${BNPB_CONSUMER_3_RABBITMQ_USER:-demo}
      BNPB_CONSUMER_3_RABBITMQ_PASSWORD: ${BNPB_CONSUMER_3_RABBITMQ_PASSWORD:?Set BNPB_CONSUMER_3_RABBITMQ_PASSWORD in .env}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - events

  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    environment:
      <<: *bnpb-environment
      BNPB_API_HTTP_ADDR: ${BNPB_API_HTTP_ADDR:-:8080}
      BNPB_AGGREGATOR_BASE_URL: ${BNPB_AGGREGATOR_BASE_URL:-http://aggregator:8083}
      BNPB_AGGREGATOR_INTERNAL_KEY: ${BNPB_AGGREGATOR_INTERNAL_KEY:?Set BNPB_AGGREGATOR_INTERNAL_KEY in .env}
      BNPB_AUTH_BASE_URL: ${BNPB_AUTH_BASE_URL:-http://auth:8084}
      BNPB_AUTH_INTERNAL_KEY: ${BNPB_AUTH_INTERNAL_KEY:?Set BNPB_AUTH_INTERNAL_KEY in .env}
    ports:
      - "8080:8080"
    networks:
      - backend
    depends_on:
      aggregator:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: [CMD, /bnpb-api, -healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5

  aggregator:
    build:
      context: .
      dockerfile: cmd/aggregator/Dockerfile
    environment:
      <<: *bnpb-environment
      BNPB_AGGREGATOR_HTTP_ADDR: ${BNPB_AGGREGATOR_HTTP_ADDR:-:8083}
      BNPB_SHUTDOWN_TIMEOUT: ${BNPB_SHUTDOWN_TIMEOUT:-10s}
      BNPB_BMKG_BASE_URL: ${BNPB_BMKG_BASE_URL:-http://bmkg:8081}
      BNPB_PVMBG_BASE_URL: ${BNPB_PVMBG_BASE_URL:-http://pvmbg:8082}
      BNPB_BMKG_API_KEY: ${BNPB_BMKG_API_KEY:-}
      BNPB_PVMBG_READER_CLIENT_ID: ${BNPB_PVMBG_READER_CLIENT_ID:-}
      BNPB_PVMBG_READER_CLIENT_SECRET: ${BNPB_PVMBG_READER_CLIENT_SECRET:-}
      BNPB_AGGREGATOR_INTERNAL_KEY: ${BNPB_AGGREGATOR_INTERNAL_KEY:-}
      BNPB_CANONICAL_DATABASE_URL: ${BNPB_CANONICAL_DATABASE_URL:-}
      BNPB_AMQP_URL: ${BNPB_AMQP_URL:-}
      BNPB_HAZARD_EXCHANGE: ${BNPB_HAZARD_EXCHANGE:-hazard.events}
      BNPB_BMKG_POLL_INTERVAL: ${BNPB_BMKG_POLL_INTERVAL:-3s}
      BNPB_PVMBG_POLL_INTERVAL: ${BNPB_PVMBG_POLL_INTERVAL:-3s}
      BNPB_BMKG_HTTP_TIMEOUT: ${BNPB_BMKG_HTTP_TIMEOUT:-1s}
      BNPB_PVMBG_HTTP_TIMEOUT: ${BNPB_PVMBG_HTTP_TIMEOUT:-5s}
      BNPB_PVMBG_CYCLE_TIMEOUT: ${BNPB_PVMBG_CYCLE_TIMEOUT:-12s}
      BNPB_POLL_OVERLAP: ${BNPB_POLL_OVERLAP:-2s}
      BNPB_RETRY_MAX_BACKOFF: ${BNPB_RETRY_MAX_BACKOFF:-15s}
      BNPB_WARNING_RECONCILE_INTERVAL: ${BNPB_WARNING_RECONCILE_INTERVAL:-60s}
      BNPB_SOURCE_STALE_AFTER: ${BNPB_SOURCE_STALE_AFTER:-20s}
      BNPB_INGEST_MAX_RESPONSE_BYTES: ${BNPB_INGEST_MAX_RESPONSE_BYTES:-33554432}
      BNPB_INGEST_CHUNK_RECORDS: ${BNPB_INGEST_CHUNK_RECORDS:-100}
      BNPB_DB_READ_MAX_CONNS: ${BNPB_DB_READ_MAX_CONNS:-16}
      BNPB_DB_WRITE_MAX_CONNS: ${BNPB_DB_WRITE_MAX_CONNS:-4}
      BNPB_DB_READ_TIMEOUT: ${BNPB_DB_READ_TIMEOUT:-200ms}
      BNPB_DB_WRITE_TIMEOUT: ${BNPB_DB_WRITE_TIMEOUT:-2s}
      BNPB_READ_MAX_IN_FLIGHT: ${BNPB_READ_MAX_IN_FLIGHT:-32}
      BNPB_LIST_DEFAULT_LIMIT: ${BNPB_LIST_DEFAULT_LIMIT:-100}
      BNPB_LIST_MAX_LIMIT: ${BNPB_LIST_MAX_LIMIT:-500}
      BNPB_PUBLISH_TIMEOUT: ${BNPB_PUBLISH_TIMEOUT:-5s}
      BNPB_OUTBOX_BATCH_SIZE: ${BNPB_OUTBOX_BATCH_SIZE:-100}
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    networks:
      - backend
      - canonical-store
      - events
    healthcheck:
      test: [CMD, /bnpb-aggregator, -healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: cmd/auth/Dockerfile
    environment:
      <<: *bnpb-environment
      BNPB_AUTH_HTTP_ADDR: ${BNPB_AUTH_HTTP_ADDR:-:8084}
      BNPB_AUTH_ACCESS_TOKEN_TTL: ${BNPB_AUTH_ACCESS_TOKEN_TTL:-60s}
      BNPB_AUTH_REFRESH_SESSION_TTL: ${BNPB_AUTH_REFRESH_SESSION_TTL:-8h}
      BNPB_AUTH_INTERNAL_KEY: ${BNPB_AUTH_INTERNAL_KEY:?Set BNPB_AUTH_INTERNAL_KEY in .env}
      BNPB_MEDIA_CLIENT_ID: ${BNPB_MEDIA_CLIENT_ID:-media}
      BNPB_MEDIA_CLIENT_SECRET: ${BNPB_MEDIA_CLIENT_SECRET:?Set BNPB_MEDIA_CLIENT_SECRET in .env}
      BNPB_FIELD_CLIENT_ID: ${BNPB_FIELD_CLIENT_ID:-field-team}
      BNPB_FIELD_CLIENT_SECRET: ${BNPB_FIELD_CLIENT_SECRET:?Set BNPB_FIELD_CLIENT_SECRET in .env}
      BNPB_OPS_CLIENT_ID: ${BNPB_OPS_CLIENT_ID:-internal-ops}
      BNPB_OPS_CLIENT_SECRET: ${BNPB_OPS_CLIENT_SECRET:?Set BNPB_OPS_CLIENT_SECRET in .env}
    networks:
      - backend
    healthcheck:
      test: [CMD, /bnpb-auth, -healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5

  consumer-1:
    build:
      context: .
      dockerfile: cmd/consumer-1/Dockerfile
    environment:
      <<: *bnpb-environment
      BNPB_CONSUMER_1_HTTP_ADDR: ${BNPB_CONSUMER_1_HTTP_ADDR:-:8085}
      BNPB_CONSUMER_1_RABBITMQ_USER: ${BNPB_CONSUMER_1_RABBITMQ_USER:-dashboard}
      BNPB_CONSUMER_1_RABBITMQ_PASSWORD: ${BNPB_CONSUMER_1_RABBITMQ_PASSWORD:?Set BNPB_CONSUMER_1_RABBITMQ_PASSWORD in .env}
    volumes:
      - consumer-1-data:/data
    depends_on:
      broker-init:
        condition: service_completed_successfully
    networks:
      - events
    healthcheck:
      test: [CMD, /bnpb-consumer-1, -healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5

  consumer-2:
    build:
      context: .
      dockerfile: cmd/consumer-2/Dockerfile
    environment:
      <<: *bnpb-environment
      BNPB_CONSUMER_2_HTTP_ADDR: ${BNPB_CONSUMER_2_HTTP_ADDR:-:8086}
      BNPB_CONSUMER_2_RABBITMQ_USER: ${BNPB_CONSUMER_2_RABBITMQ_USER:-notifications}
      BNPB_CONSUMER_2_RABBITMQ_PASSWORD: ${BNPB_CONSUMER_2_RABBITMQ_PASSWORD:?Set BNPB_CONSUMER_2_RABBITMQ_PASSWORD in .env}
    volumes:
      - consumer-2-data:/data
    depends_on:
      broker-init:
        condition: service_completed_successfully
    networks:
      - events
    healthcheck:
      test: [CMD, /bnpb-consumer-2, -healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5

  consumer-3:
    profiles: [demo]
    build:
      context: .
      dockerfile: cmd/consumer-3/Dockerfile
    environment:
      <<: *bnpb-environment
      BNPB_CONSUMER_3_HTTP_ADDR: ${BNPB_CONSUMER_3_HTTP_ADDR:-:8087}
      BNPB_CONSUMER_3_RABBITMQ_USER: ${BNPB_CONSUMER_3_RABBITMQ_USER:-demo}
      BNPB_CONSUMER_3_RABBITMQ_PASSWORD: ${BNPB_CONSUMER_3_RABBITMQ_PASSWORD:?Set BNPB_CONSUMER_3_RABBITMQ_PASSWORD in .env}
    volumes:
      - consumer-3-data:/data
    depends_on:
      broker-init:
        condition: service_completed_successfully
    networks:
      - events
    healthcheck:
      test: [CMD, /bnpb-consumer-3, -healthcheck]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  backend:
  canonical-store:
    internal: true
  events:

volumes:
  postgres-data:
  rabbitmq-data:
  consumer-1-data:
  consumer-2-data:
  consumer-3-data:
