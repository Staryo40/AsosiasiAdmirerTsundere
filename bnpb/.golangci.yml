            - github.com/Staryo40/AsosiasiAdmirerTsundere/bnpb/internal/field-intake/
            - github.com/Staryo40/AsosiasiAdmirerTsundere/bnpb/internal/platform$
            - github.com/Staryo40/AsosiasiAdmirerTsundere/bnpb/internal/platform/
          deny: *bnpb-boundary

        satellite:
          list-mode: lax
          files:
            - '**/cmd/satellite/**'
            - '**/internal/satellite/**'
          allow:
            - github.com/Staryo40/AsosiasiAdmirerTsundere/bnpb/internal/satellite$
            - github.com/Staryo40/AsosiasiAdmirerTsundere/bnpb/internal/satellite/
            - github.com/Staryo40/AsosiasiAdmirerTsundere/bnpb/internal/platform$
            - github.com/Staryo40/AsosiasiAdmirerTsundere/bnpb/internal/platform/
          deny: *bnpb-boundary

        fence-host:
