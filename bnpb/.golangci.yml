            - github.com/Staryo40/AsosiasiAdmirerTsundere/bnpb/internal/catalogload/
            - github.com/Staryo40/AsosiasiAdmirerTsundere/bnpb/internal/platform$
            - github.com/Staryo40/AsosiasiAdmirerTsundere/bnpb/internal/platform/
          deny: *bnpb-boundary

        placement-compare:
          list-mode: lax
          files:
            - '**/cmd/placement-compare/**'
            - '**/internal/placementcompare/**'
          allow:
