worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null emerg;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65s;

    # Docker's embedded DNS. Re-check service records after container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    upstream bnpb_api {
        zone bnpb_api 64k;
        server api:8080 resolve;
    }

    upstream bmkg_source {
        zone bmkg_source 64k;
        server bmkg:8081 resolve;
    }

    upstream pvmbg_source {
        zone pvmbg_source 64k;
        server pvmbg:8082 resolve;
    }

    # Only the documented method/path pairs reach an upstream. Query strings
    # are deliberately excluded so the application validates them itself.
    map "$request_method:$uri" $swagger_route_allowed {
        default 0;
        ~^POST:/api/bnpb/auth/(login|refresh)$ 1;
        ~^GET:/api/bnpb/v1/hazards(/[^/]+)?$ 1;
        ~^GET:/api/bnpb/(health|ready)$ 1;
        ~^GET:/api/bmkg/(seismic-events|tsunami-warnings|health)$ 1;
        ~^POST:/api/pvmbg/auth/login$ 1;
        ~^GET:/api/pvmbg/(volcanic-reports|health)$ 1;
        ~^POST:/api/pvmbg/admin/(schema-version|outage|response-delay)$ 1;
    }

    # Access and error logs are disabled so credentials, bodies and query
    # strings never enter container logs. Use direct service logs for diagnosis.
    access_log off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        access_log off;

        location = /healthz {
            default_type text/plain;
            return 200 "ok";
        }

        location = / {
            add_header Cache-Control "no-store" always;
            try_files /index.html =404;
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        location = /swagger-config.js {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        location ^~ /specs/ {
            default_type application/yaml;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        location ^~ /api/bnpb/ {
            if ($swagger_route_allowed = 0) { return 404; }
            rewrite ^/api/bnpb/(.*)$ /$1 break;
            proxy_pass http://bnpb_api;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-BMKG-Key "";
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
            proxy_redirect off;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_intercept_errors off;
            proxy_next_upstream off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        location ^~ /api/bmkg/ {
            if ($swagger_route_allowed = 0) { return 404; }
            rewrite ^/api/bmkg/(.*)$ /$1 break;
            proxy_pass http://bmkg_source;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header Connection "";
            proxy_set_header Authorization "";
            proxy_set_header X-BMKG-Key $http_x_bmkg_key;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
            proxy_redirect off;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_intercept_errors off;
            proxy_next_upstream off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        location ^~ /api/pvmbg/ {
            if ($swagger_route_allowed = 0) { return 404; }
            rewrite ^/api/pvmbg/(.*)$ /$1 break;
            proxy_pass http://pvmbg_source;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-BMKG-Key "";
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
            proxy_redirect off;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_intercept_errors off;
            proxy_next_upstream off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        # Static files are served only when they exist. API paths never fall
        # through to index.html, including unknown methods and trailing slashes.
        location / {
            try_files $uri =404;
        }
    }
}
